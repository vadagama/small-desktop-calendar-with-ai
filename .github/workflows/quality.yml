name: Desktop quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototype/package-lock.json
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: desktop-wails/go.mod
          cache-dependency-path: desktop-wails/go.sum
      - name: Install locked packages without dependency scripts
        run: |
          npm install --global npm@10.9.8 --ignore-scripts
          npm ci --ignore-scripts
          npm ci --prefix prototype --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run check --prefix prototype
      - run: npm test --prefix prototype
      - name: Build pinned native Whisper runtime
        run: npm run voice:build
      - run: npm run build
      - run: go -C desktop-wails vet ./...
      - name: Go tests with race detector
        run: go -C desktop-wails test -race ./...
      - name: Wails integration tests with synthetic services
        run: npm run test:wails
      - run: npm audit --audit-level=high
      - run: npm audit --prefix prototype --audit-level=high
      - name: Package and verify the locally signed Ordo DMG
        run: node scripts/package-wails-mac.mjs --out release/ci
