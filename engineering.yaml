  purpose: Establishes a project's quality bar as a written contract and stops agents
    quietly lowering it. Interviews the user on which dimensions matter, supplies
    sane default thresholds when they have no number in mind, records everything in
    CONSTRAINTS.md, and watches the diff for a weakened bar — new @ts-ignore or eslint-disable
    suppressions, skipped or deleted tests, assertions stripped out, unimplemented
    stubs, thresholds edited down. Use when no quality bar is written down, when the
    user says "set up constraints" or "define our standards", when the user wants
    dimensions they care about — accessibility, web performance, coverage — set up
