  - ".claude/skills/security-and-hardening/"
  purpose: Hardens code against vulnerabilities. Use when auditing an input handler
    for vulnerabilities, when handling user input, authentication, data storage, or
    external integrations, or when checking a login flow is safe against the OWASP
    Top Ten. Use when building any feature that accepts untrusted data, manages user
    sessions, or interacts with third-party services. Use when auditing dependencies
    for known vulnerabilities, triaging package-manager audit findings, or assessing
    supply-chain risk in a new package. Use when personal data or privacy compliance
    (GDPR, CCPA) is involved.
  status: current
